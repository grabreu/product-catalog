name: Reusable / Frontend Tests

on:
  workflow_call:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify route tree is up to date
        run: |
          pnpm run generate:routes
          git diff --exit-code -- src/routeTree.gen.ts || {
            echo "::error::src/routeTree.gen.ts is out of date. Run 'pnpm run generate:routes' and commit the result."
            exit 1
          }

      - name: Type check
        run: pnpm exec tsc -b

      - name: Test
        run: pnpm test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: frontend/coverage
