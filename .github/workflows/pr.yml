name: PR / Validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    uses: ./.github/workflows/_format.yml

  tests:
    name: Tests
    uses: ./.github/workflows/_tests.yml

  sonarcloud:
    name: SonarCloud
    needs: [format, tests]
    uses: ./.github/workflows/_sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
