name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build image
        run: |
          docker build -f src/ProductCatalog.Api/Dockerfile \
            -t ghcr.io/grabreu/product-catalog-api:${{ github.event.workflow_run.head_sha }} \
            -t ghcr.io/grabreu/product-catalog-api:latest \
            .

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: |
          docker push ghcr.io/grabreu/product-catalog-api:${{ github.event.workflow_run.head_sha }}
          docker push ghcr.io/grabreu/product-catalog-api:latest
