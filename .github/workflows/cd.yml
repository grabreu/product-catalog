name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  packages: write
  id-token: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    name: Format
    uses: ./.github/workflows/_format.yml

  tests:
    name: Tests
    uses: ./.github/workflows/_tests.yml

  sonarcloud:
    name: SonarCloud
    needs: [format, tests]
    uses: ./.github/workflows/_sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    name: Publish
    needs: [sonarcloud]
    uses: ./.github/workflows/_publish.yml

  deploy:
    name: Deploy
    needs: [publish]
    uses: ./.github/workflows/_deploy.yml
    with:
      image_ref: ${{ needs.publish.outputs.image_ref }}
