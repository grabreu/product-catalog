name: Reusable / Deploy

on:
  workflow_call:
    inputs:
      image_ref:
        description: Immutable image reference to deploy
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ca-product-catalog-api \
              --resource-group rg-product-catalog \
              --image ${{ inputs.image_ref }}
