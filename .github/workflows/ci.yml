name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - "frontend/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    uses: ./.github/workflows/_format.yml

  tests:
    name: Tests
    uses: ./.github/workflows/_tests.yml

  sonarcloud:
    name: SonarCloud
    needs: [format, tests]
    if: github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/_sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
