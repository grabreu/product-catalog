name: Reusable / Docker

on:
  workflow_call:
    outputs:
      image_ref:
        description: Immutable image reference
        value: ${{ jobs.build.outputs.image_ref }}

      digest:
        description: Image digest
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/product-catalog-api

    outputs:
      image_ref: ${{ steps.image.outputs.ref }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/src/ProductCatalog.Api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.sha }}

      - name: Resolve immutable image reference
        id: image
        run: echo "ref=${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo "- Tag: \`${{ env.IMAGE_NAME }}:${{ github.sha }}\`"
            echo "- Immutable ref: \`${{ steps.image.outputs.ref }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
